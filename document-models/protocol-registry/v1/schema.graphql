type ProtocolRegistryState {
  protocols: [ProtocolEntry!]!
}

type ProtocolEntry {
  id: String!
  status: ProtocolStatus!
  chains: [ChainManifest!]!
  plugins: [String!]!
  notes: String
  updatedAt: DateTime
}

enum ProtocolStatus {
  ACTIVE
  RETIRED
}

type ChainManifest {
  chainId: Int!
  contracts: [ContractRef!]!
  events: [EventRule!]!
}

type ContractRef {
  name: String!
  address: String!
  kind: ContractKind!
  underlying: String
}

enum ContractKind {
  CORE
  POSITION
  DEBT
}

type EventRule {
  topic: String!
  name: String!
  semantic: EventSemantic!
}

type EventSemantic {
  type: String!
  subtype: String!
}

