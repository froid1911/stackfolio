scalar Unknown
scalar DateTime
scalar Address
scalar AttachmentRef
scalar Amount_Tokens
scalar EthereumAddress
scalar EmailAddress
scalar Amount_Percentage
scalar Date
scalar URL
scalar Amount_Money
scalar OLabel
scalar Currency
scalar PHID
scalar OID
scalar Amount_Fiat
scalar Amount_Currency
scalar Amount_Crypto
scalar Amount
scalar Upload

type WalletAccountState {
  address: String!
  chainId: Int!
  label: String
  ignored: Boolean!
  ledger: [LedgerEvent!]!
  cursor: ScanCursor
  backfill: BackfillState
  redecode: BackfillState
  nativeBalance: NativeBalance
  bitcoinXpub: String
  ensNames: [EnsName!]!
}

type LedgerEvent {
  id: OID!
  eventIdentifier: String!
  sequenceIndex: Int!
  timestamp: DateTime!
  type: EventType!
  subtype: EventSubtype!
  asset: String!
  amount: String!
  counterparty: String
  counterpartyLabel: String
  notes: String
  ignored: Boolean!
  source: EventSource!
  importBatch: String
  valuation: Valuation
}

type Valuation {
  unit: String!
  price: String!
  source: ValuationSource!
  granularity: ValuationGranularity!
  pinnedAt: DateTime!
}

type EnsName {
  name: String!
  owned: Boolean!
}

type ScanCursor {
  lastLogsBlock: Int
  lastNativeScanBlock: Int
  lastEventTimestamp: DateTime
  lastRunAt: DateTime
}

type BackfillState {
  state: BackfillPhase!
  startBlock: Int
  nextBlock: Int
}

type NativeBalance {
  amount: String!
  blockNumber: Int!
  observedAt: DateTime!
}

enum EventType {
  SPEND
  RECEIVE
  TRADE
  TRANSFER
  STAKING
  MIGRATE
  INFORMATIONAL
}

enum EventSubtype {
  NONE
  FEE
  APPROVE
  WITHDRAWAL
  BLOCK_PRODUCTION
  SPAM
  AIRDROP
  DONATE
  DEPOSIT_ASSET
  REMOVE_ASSET
  BORROW
  REPAY
  LIQUIDATION
  YIELD
  LP_MINT
  LP_BURN
  NAME_REGISTRATION
  BRIDGE
}

enum EventSource {
  CHAIN
  MANUAL
}

enum ValuationSource {
  COINGECKO
  MANUAL
  UNPRICED
}

enum ValuationGranularity {
  DAY
  NONE
}

enum BackfillPhase {
  IDLE
  LOGS
  NATIVE
  DONE
}

# account

input SetAccountDetailsInput {
  address: String
  chainId: Int
  label: String
}

input SetIgnoredInput {
  ignored: Boolean!
}

input SetWalletXpubInput {
  xpub: String
}

input SetEnsNamesInput {
  names: [EnsNameInput!]!
}

input EnsNameInput {
  name: String!
  owned: Boolean!
}

# feed

input ImportEventsInput {
  batchId: String!
  importedAt: DateTime!
  events: [ImportedEventInput!]!
}

input ImportedEventInput {
  id: OID!
  eventIdentifier: String!
  sequenceIndex: Int!
  timestamp: DateTime!
  type: EventType!
  subtype: EventSubtype!
  asset: String!
  amount: String!
  counterparty: String
  notes: String
  valuation: ValuationInput
}

input ValuationInput {
  unit: String!
  price: String!
  source: ValuationSource!
  granularity: ValuationGranularity!
  pinnedAt: DateTime!
}

input ReplaceEventsInput {
  batchId: String!
  remove: [EventLocatorInput!]!
  add: [ImportedEventInput!]!
}

input EventLocatorInput {
  id: OID!
  sequenceIndex: Int!
}

input ImportedEventInput {
  id: OID!
  eventIdentifier: String!
  sequenceIndex: Int!
  timestamp: DateTime!
  type: EventType!
  subtype: EventSubtype!
  asset: String!
  amount: String!
  counterparty: String
  notes: String
  valuation: ValuationInput
}

input ValuationInput {
  unit: String!
  price: String!
  source: ValuationSource!
  granularity: ValuationGranularity!
  pinnedAt: DateTime!
}

# review

input SetEventIgnoredInput {
  id: OID!
  ignored: Boolean!
}

input SetEventNotesInput {
  id: OID!
  notes: String
}

input RetypeEventInput {
  id: OID!
  type: EventType!
  subtype: EventSubtype!
}

input PinValuationsInput {
  events: [PinValuationInput!]!
}

input PinValuationInput {
  id: OID!
  sequenceIndex: Int!
  valuation: ValuationInput!
}

input ValuationInput {
  unit: String!
  price: String!
  source: ValuationSource!
  granularity: ValuationGranularity!
  pinnedAt: DateTime!
}

# cursor

input RecordScanProgressInput {
  lastLogsBlock: Int
  lastNativeScanBlock: Int
  lastEventTimestamp: DateTime
  ranAt: DateTime!
}

input SetBackfillStateInput {
  state: BackfillPhase!
  startBlock: Int
  nextBlock: Int
}

input SetNativeBalanceInput {
  amount: String!
  blockNumber: Int!
  observedAt: DateTime!
}

input SetRedecodeStateInput {
  state: BackfillPhase!
  startBlock: Int
  nextBlock: Int
}
