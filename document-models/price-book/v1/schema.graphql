type PriceBookState {
  baseCurrency: String!
  latest: [LatestPrice!]!
  history: [PricePoint!]!
  status: FetchStatus!
}

type LatestPrice {
  asset: String!
  price: String!
  source: String!
  fetchedAt: DateTime!
}

type PricePoint {
  asset: String!
  hour: DateTime!
  price: String!
  source: String!
}

type FetchStatus {
  lastFetchAt: DateTime
  lastError: String
}

# prices

input RecordPricesInput {
  baseCurrency: String!
  prices: [RecordedPriceInput!]!
  hour: DateTime!
  fetchedAt: DateTime!
}

input RecordedPriceInput {
  asset: String!
  price: String!
  source: String!
}

input SetBaseCurrencyInput {
  baseCurrency: String!
}

input RecordFetchErrorInput {
  at: DateTime!
  error: String!
}
