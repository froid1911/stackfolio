type HyperliquidAccountState {
  accounts: [HlAccount!]!
}

type HlAccount {
  address: String!
  label: String
  accountValueUsd: String
  spot: [HlSpotBalance!]!
  perps: [HlPerpPosition!]!
  fills: [HlFill!]!
  updatedAt: DateTime
}

type HlSpotBalance {
  tokenIndex: Int!
  coin: String!
  total: String!
  hold: String!
}

type HlPerpPosition {
  coin: String!
  szi: String!
  entryPx: String!
  positionValue: String!
  unrealizedPnl: String!
}

type HlFill {
  tid: Int!
  coin: String!
  side: String!
  px: String!
  sz: String!
  time: Int!
  dir: String
  fee: String
  closedPnl: String
}

# Hyperliquid

input UpsertAccountInput {
  address: String!
  label: String
}

input RecordSnapshotInput {
  address: String!
  accountValueUsd: String
  spot: [HlSpotInput!]!
  perps: [HlPerpInput!]!
  fills: [HlFillInput!]!
  updatedAt: DateTime!
}
input HlSpotInput {
  tokenIndex: Int!
  coin: String!
  total: String!
  hold: String!
}
input HlPerpInput {
  coin: String!
  szi: String!
  entryPx: String!
  positionValue: String!
  unrealizedPnl: String!
}
input HlFillInput {
  tid: Int!
  coin: String!
  side: String!
  px: String!
  sz: String!
  time: Int!
  dir: String
  fee: String
  closedPnl: String
}
