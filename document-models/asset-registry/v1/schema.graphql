type AssetRegistryState {
  assets: [Asset!]!
}

type Asset {
  id: OID!
  identifier: String!
  symbol: String!
  name: String!
  decimals: Int!
  kind: AssetKind!
  chainId: Int!
  coingeckoId: String
  custom: Boolean!
  addedAt: DateTime!
}

enum AssetKind {
  NATIVE
  ERC20
}

# registry

input RegisterAssetInput {
  id: OID!
  identifier: String!
  symbol: String!
  name: String!
  decimals: Int!
  kind: AssetKind!
  chainId: Int!
  coingeckoId: String
  custom: Boolean!
  addedAt: DateTime!
}

input UpdateAssetInput {
  identifier: String!
  symbol: String
  name: String
  decimals: Int
}

input SetCoingeckoIdInput {
  identifier: String!
  coingeckoId: String
}

input RemoveAssetInput {
  identifier: String!
}
